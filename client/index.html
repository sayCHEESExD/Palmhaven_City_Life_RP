<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff7aa8'/%3E%3Ccircle cx='32' cy='40' r='14' fill='%23ffd166'/%3E%3Crect y='40' width='64' height='24' fill='%2328c3d4'/%3E%3Cpath d='M30 58 Q34 36 36 22' stroke='%236b3f1d' stroke-width='5' fill='none'/%3E%3Cpath d='M36 22 Q24 12 12 20 M36 22 Q48 10 56 20 M36 22 Q30 26 22 34 M36 22 Q46 26 50 34' stroke='%231f9d55' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Palmhaven City Life RP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800;900&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Pacifico&family=Righteous&display=swap" rel="stylesheet" />

    <!--
      The Bloxity SDK.
      Loaded BEFORE the game bundle so `window.Legion` is there when `main.ts`
      calls `init`. It is deliberately NOT `async`: the bundle is a module and
      therefore deferred, and a plain script above it is guaranteed to have run
      first. If the CDN is unreachable the game still boots - every call goes
      through a guard that treats a missing SDK as "no portal".
    -->
    <script src="https://sdk.bloxity.io/legion-sdk.min.js"></script>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        /*
         * Dynamic viewport units: on iOS and Android the browser's own toolbar
         * shrinks and grows as you scroll, and a percentage height is measured
         * against the LARGE viewport - so the bottom of the game would sit
         * under the toolbar until you scrolled. The 100% above is the fallback.
         */
        height: 100dvh;
        overflow: hidden;
        /* No pinch-zoom, no double-tap zoom, no rubber-banding over the game. */
        touch-action: none;
        background: #1c6f8f;
        font-family: "Grandstander", "Fredoka", "Baloo 2", "Nunito", "Segoe UI", system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /*
       * Kept for the portal: a class that hides the cursor.
       *
       * Pointer lock hides it while it holds, but the browser hands it back on
       * every Escape and will not grant it again until the player's next
       * gesture - so between those two moments a pointer would sit over the
       * game with nothing to click. This class covers that window.
       */
      body.aoe-cursor-hidden,
      body.aoe-cursor-hidden * {
        cursor: none !important;
      }
      #app {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        text-align: center;
        color: #ffffff;
        background: linear-gradient(180deg, #ff9ec4 0%, #ffbf7a 38%, #4fc9d9 62%, #146a8c 100%);
        font-size: 13px;
        transition: opacity 240ms ease;
      }
      #boot[hidden] {
        display: none;
      }
      /*
       * Offline: the panel stops covering the game and becomes a corner card,
       * so the session is still playable but never silently pretends to be
       * connected. Everything it gates - money, jobs, homes - is server-owned.
       */
      #boot.notice {
        inset: auto calc(env(safe-area-inset-right, 0px) + 12px)
          calc(env(safe-area-inset-bottom, 0px) + 12px) auto;
        place-content: start;
        padding: 12px 14px;
        max-width: 44ch;
        border: 1px solid #7f1d1d;
        border-radius: 8px;
        background: rgba(16, 34, 52, 0.94);
        pointer-events: none;
      }
      #boot.notice h1 {
        margin-bottom: 6px;
      }
      #boot-logo {
        justify-self: center;
        image-rendering: auto;
        filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
      }
      /* The corner notice has no room for a logo. */
      #boot.notice #boot-logo {
        display: none;
      }
      #boot h1 {
        font-size: 30px;
        letter-spacing: 0.02em;
        color: #ffffff;
        font-family: "Pacifico", "Grandstander", cursive; font-weight: 400; font-size: 38px; text-shadow: 3px 3px 0 #b8356b, 0 6px 14px rgba(0,0,0,0.35);
      }
      #boot .err {
        color: #fca5a5;
        max-width: 60ch;
        white-space: pre-wrap;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <img id="boot-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff7aa8'/%3E%3Ccircle cx='32' cy='40' r='14' fill='%23ffd166'/%3E%3Crect y='40' width='64' height='24' fill='%2328c3d4'/%3E%3Cpath d='M30 58 Q34 36 36 22' stroke='%236b3f1d' stroke-width='5' fill='none'/%3E%3Cpath d='M36 22 Q24 12 12 20 M36 22 Q48 10 56 20 M36 22 Q30 26 22 34 M36 22 Q46 26 50 34' stroke='%231f9d55' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" alt="" width="110" height="110" />
      <h1>Palmhaven City Life RP</h1>
      <p id="boot-status">Loading&hellip;</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
